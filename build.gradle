plugins {
    id 'java'
}

group = 'com.horsefollow'
// version vem do gradle.properties (version=1.0.0)

repositories {
    mavenCentral()
}

dependencies {
    compileOnly files('libs/HytaleServer.jar')
    implementation files('libs/HyUI-0.5.10-all.jar')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filteringCharset = 'UTF-8'

    // INJETA a versão no manifest.json durante o build
    filesMatching('manifest.json') {
        expand(modVersion: project.version.toString())
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // 1) Classes e recursos do mod (obrigatório; sem isso o JAR não teria com.horsefollow nem Common/UI/...)
    from sourceSets.main.output
    // 2) HyUI e outros JARs do runtime (fat JAR para um único arquivo na pasta Mods)
    from {
        configurations.runtimeClasspath
            .findAll { it.name.endsWith('jar') }
            .collect { zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    archiveFileName = "HorseFollow-${project.version}.jar"
}

